<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>App · Diário alimentar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5135}a:hover{color:#2E2A26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EE; font-family: Nunito, system-ui, sans-serif; color: #2E2A26; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1; overflow: hidden; padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #5E574F">Hoje, 23 de novembro</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 800; color: #1F5135">Diário alimentar</h1>
</div>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 18px; border: 0; background: #1F5135; color: #FBF6EE; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"></rect><path d="M8 7l2-3h4l2 3"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>Fotografar refeição</button>

<sc-for list="{{ entries }}" as="e" hint-placeholder-count="3">
<sc-if value="{{ e.done }}" hint-placeholder-val="{{ true }}">
<article style="background: #FFFFFF; border-radius: 18px; padding: 10px; display: flex; gap: 12px; align-items: center">
<div role="img" aria-label="{{ e.photoLabel }}" style="width: 76px; height: 76px; flex: none; border-radius: 14px; background: #DDEFC8; display: flex; align-items: center; justify-content: center">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#FFFFFF" stroke="#1F5135" stroke-width="2"></circle><circle cx="20" cy="20" r="9" fill="none" stroke="#A8D13C" stroke-width="2"></circle></svg>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><strong style="font-size: 16px; color: #1F5135">{{ e.meal }}</strong><span style="font-size: 13px; color: #5E574F">{{ e.time }}</span></div>
<span style="font-size: 14px; line-height: 1.35">{{ e.desc }}</span>
<span style="font-size: 14px; font-weight: 800">{{ e.kcal }}</span>
</div>
</article>
</sc-if>
<sc-if value="{{ e.todo }}" hint-placeholder-val="{{ false }}">
<div style="border: 2px dashed #D9D2C5; border-radius: 18px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
<strong style="font-size: 16px; color: #1F5135">{{ e.meal }}</strong>
<span style="font-size: 14px; color: #5E574F">Ainda por registar</span>
</div>
</sc-if>
</sc-for>

<div style="background: #FFFFFF; border-radius: 18px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline">
<span style="font-weight: 700">Hoje até agora</span>
<strong style="font-size: 18px; color: #1F5135">≈ 830 kcal</strong>
</div>
<p style="margin: 0; font-size: 13px; color: #5E574F; line-height: 1.4; text-align: center">As calorias são uma estimativa feita pela IA a partir da foto. A Inês vê o teu diário.</p>
</div>

<nav aria-label="Separadores" style="background: #FFFFFF; border-top: 1px solid #EFE9DE; padding: 8px 4px 22px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))">
<a href="App-Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; text-decoration: none; color: #5E574F; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4z"></path></svg>Início</a>
<a href="App-Plano.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; text-decoration: none; color: #5E574F; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"></path><path d="M9 9h6M9 13h6"></path></svg>Plano</a>
<a href="App-Diario.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; text-decoration: none; color: #1F5135; font-size: 11px; font-weight: 800"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"></rect><path d="M8 7l2-3h4l2 3"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>Diário</a>
<a href="App-Compras.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; text-decoration: none; color: #5E574F; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 8H7"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg>Compras</a>
<a href="App-Evolucao.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; text-decoration: none; color: #5E574F; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 10 12l4 3 6-8"></path></svg>Evolução</a>
<a href="App-Documentos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; text-decoration: none; color: #5E574F; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>Documentos</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { meal: 'Pequeno-almoço', time: '08:10', desc: 'Iogurte com aveia e frutos vermelhos', kcal: '≈ 310 kcal', done: true },
      { meal: 'Almoço', time: '13:05', desc: 'Frango grelhado, arroz e brócolos', kcal: '≈ 520 kcal', done: true },
      { meal: 'Lanche', done: false }
    ];
    return {
      entries: rows.map(function (r) {
        return { meal: r.meal, time: r.time || '', desc: r.desc || '', kcal: r.kcal || '', done: r.done, todo: !r.done, photoLabel: 'Foto do ' + r.meal.toLowerCase() };
      })
    };
  }
}
</script>
</body>
</html>
