<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>App · Plano</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5135}a:hover{color:#2E2A26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EE; font-family: Nunito, system-ui, sans-serif; color: #2E2A26; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1; overflow: hidden; padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #5E574F">1 set – 15 dez · semana 13 de 15</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 800; color: #1F5135">O teu plano</h1>
</div>

<div style="background: #FCE3DD; border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 1.45">
<strong style="display: block; color: #1F5135">Nota da Inês</strong>
Este mês o foco é a água e a caminhada. Não precisa de ser perfeito: um passo de cada vez.
</div>

<sc-for list="{{ meals }}" as="m" hint-placeholder-count="4">
<section style="background: #FFFFFF; border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 16px; font-weight: 800; color: #1F5135">{{ m.name }}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px">
<sc-for list="{{ m.items }}" as="i" hint-placeholder-count="3">
<li style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px"><span>{{ i.n }}</span><span style="color: #5E574F; white-space: nowrap">{{ i.q }}</span></li>
</sc-for>
</ul>
</section>
</sc-for>

<p style="margin: 0; font-size: 13px; color: #5E574F; text-align: center">O teu plano foi feito pela Inês, só para ti.</p>
</div>

<nav aria-label="Separadores" style="background: #FFFFFF; border-top: 1px solid #EFE9DE; padding: 8px 4px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">

</nav>
