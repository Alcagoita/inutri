# Installed by the framework setup. AI review on every PR (step 5 of the framework).
# Install the app on the repository: https://github.com/apps/coderabbitai/installations/new
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["develop", "main"]
  path_instructions:
    - path: "**/*"
      instructions: >-
        Review against the ticket named in the PR title: flag changes outside its goal.
        Check that logic has unit tests. Read AGENTS.md and flag anything that breaks a
        product promise or a model fact listed there.
chat:
  auto_reply: true
