# Installed by the framework setup. Every PR title and commit starts with a ticket key.
# The pattern lives in .github/ticket-key-pattern (also read by the local commit-msg hook).
name: ticket-key
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  ticket-key:
    name: ticket-key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR title and commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN="$(head -1 .github/ticket-key-pattern)"
          bad=0
          if ! printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "::error::PR title must start with a ticket key, e.g. INU-12: add the invite link"
            bad=1
          fi
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject="$(git log -1 --format=%s "$sha")"
            if ! printf '%s' "$subject" | grep -Eq "$PATTERN"; then
              echo "::error::Commit $sha does not start with a ticket key: $subject"
              bad=1
            fi
          done
          exit $bad
