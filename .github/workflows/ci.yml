# Installed by the framework setup. Unit tests on every PR and on pushes to main/develop.
# Stack: Kotlin Multiplatform (Gradle). Keep the job name "test": the merge rules require it.
name: ci
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew check --stacktrace
          else
            echo "No Gradle project yet. Add tests with the first ticket that has logic."
          fi
